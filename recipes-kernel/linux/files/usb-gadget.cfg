# USB gadget (device-side) configuration for linux-adi 6.12, fixing the vmlinux link error
# "f_rndis.c: undefined reference to gether_* / usb_interface_id / config_ep_by_speed ...".
#
# Cause: a gadget function (RNDIS) ended up built into the kernel (=y) while the gadget core it calls
# (libcomposite, u_ether) was a module (=m). Built-in code can't call into a module, so the link fails.
#
# Fix: build the gadget core and the configfs gadget support into the kernel. Every function a
# built-in option selects then links, whatever selects it. Legacy precomposed gadgets (g_ether,
# g_multi, ...) stay modules: a built-in legacy gadget would grab the USB controller at boot and the
# configfs gadget (usb-gadget-configfs) couldn't bind.
#
# Put this fragment LAST in SRC_URI so it overrides earlier fragments and the defconfig.

CONFIG_CONFIGFS_FS=y
CONFIG_USB_GADGET=y

# Gadget core, built in. These two have no menu entry: Kconfig derives them (=y) from USB_CONFIGFS=y
# below. They are written out only so the intended result is visible here and checkable with
# check-gadget-config.sh.
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_U_ETHER=y

# Gadgets composed through configfs (used by usb-gadget-configfs), built in.
CONFIG_USB_CONFIGFS=y
# NCM: the Ethernet function the IQ Visualizer link uses (jumbo frames through max_segment_size).
CONFIG_USB_CONFIGFS_NCM=y
# Other functions that were enabled before (they follow USB_CONFIGFS, so now built in where their own
# dependencies allow: UVC needs V4L2, UAC2/MIDI need ALSA; if those are modules, so are the functions).
CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_CONFIGFS_OBEX=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_F_UAC2=y
CONFIG_USB_CONFIGFS_F_MIDI=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_F_UVC=y
CONFIG_USB_CONFIGFS_F_PRINTER=y

# Legacy precomposed gadgets: modules only (never =y, see above).
CONFIG_USB_G_NCM=m
CONFIG_USB_ETH=m
CONFIG_USB_ETH_RNDIS=y
CONFIG_USB_ETH_EEM=y
CONFIG_USB_GADGETFS=m
CONFIG_USB_FUNCTIONFS=m
CONFIG_USB_FUNCTIONFS_ETH=y
CONFIG_USB_FUNCTIONFS_RNDIS=y
# CONFIG_USB_FUNCTIONFS_GENERIC is not set
CONFIG_USB_G_SERIAL=m
CONFIG_USB_MIDI_GADGET=m
CONFIG_USB_G_PRINTER=m
CONFIG_USB_CDC_COMPOSITE=m
CONFIG_USB_G_ACM_MS=m
CONFIG_USB_G_MULTI=m
CONFIG_USB_G_MULTI_RNDIS=y
CONFIG_USB_G_MULTI_CDC=y
CONFIG_USB_G_HID=m
CONFIG_USB_G_WEBCAM=m

# Not set here on purpose: CONFIG_USB_F_* and CONFIG_USB_U_AUDIO / CONFIG_SND_RAWMIDI. They have no
# menu entry; the kernel computes them from the options above and ignores values written in a
# fragment, so listing them only hides what the build really does.
