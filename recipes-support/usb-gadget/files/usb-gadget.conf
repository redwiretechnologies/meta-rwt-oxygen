# /etc/default/usb-gadget: settings for usb-gadget-configfs (shell syntax).
# "usb-gadget-configfs switch" writes this file with the current MAC addresses if it doesn't exist.

# Fixed MAC addresses keep the host's interface name and its DHCP lease stable (e.g. from the
# legacy g_ncm: cat /sys/class/net/usb0/address, and the host side from `ip link` on the host).
DEV_MAC=22:9E:66:AA:D1:8C
HOST_MAC=20:9E:66:AA:D1:8B

# MTU on the link (the gadget announces MTU + 14 bytes as its maximum frame size). 9000 is the usual
# jumbo size; Linux 6.12 accepts up to 15000.
MTU=9000

# USB transfers kept queued (g_ether / g_ncm default 5).
QMULT=15

# USB identity. The defaults match the legacy g_ncm module (Linux Foundation 1d6b:0103).
#VENDOR_ID=0x1d6b
#PRODUCT_ID=0x0103
#MANUFACTURER="Linux"
#PRODUCT="NCM network gadget"
#SERIAL=0123456789

# Interface name of the existing link and the legacy module to fall back to.
#IFACE=usb0
#LEGACY=g_ncm
